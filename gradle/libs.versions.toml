# Gradle Version Catalog
# 모든 의존성/플러그인 버전을 중앙에서 관리
# 문서: https://docs.gradle.org/current/userguide/version_catalogs.html

[versions]
# 1) 언어
kotlin = "2.4.0"
java = "25"

# 2) 프레임워크 / 빌드 플러그인
springBoot = "4.0.6"
dependencyManagement = "1.1.7"
nativeBuild = "0.11.5"
hibernate = "7.2.12.Final"
ksp = "2.3.0"

# 3) 라이브러리
# Jakarta Persistence API 3.2.0 호환성 (Hibernate 7.x 지원)
jpa = "3.2.0"
mapstruct = "1.6.3"
mapstructSpring = "1.1.3"
kotest = "6.0.7"
mockk = "1.14.9"
springMockk = "5.0.1"
archunit = "1.4.1"
mockitoKotlin = "6.0.0"
lombokMapstructBinding = "0.2.0"
# CVE-2025-48924 보안 취약점 해결용 강제 버전
commonsLang3 = "3.20.0"

[libraries]
# Spring Boot BOM (platform)
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "springBoot" }

# JPA
jakarta-persistence-api = { module = "jakarta.persistence:jakarta.persistence-api", version.ref = "jpa" }

# MapStruct
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
mapstruct-spring-annotations = { module = "org.mapstruct.extensions.spring:mapstruct-spring-annotations", version.ref = "mapstructSpring" }
mapstruct-spring-extensions = { module = "org.mapstruct.extensions.spring:mapstruct-spring-extensions", version.ref = "mapstructSpring" }
mapstruct-spring-test-extensions = { module = "org.mapstruct.extensions.spring:mapstruct-spring-test-extensions", version.ref = "mapstructSpring" }

# Lombok-MapStruct 통합 바인딩 (Java → Kotlin 마이그레이션 시 제거)
lombok-mapstruct-binding = { module = "org.projectlombok:lombok-mapstruct-binding", version.ref = "lombokMapstructBinding" }

# Kotest
kotest-assertions-core = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotest" }
kotest-runner-junit5 = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }

# MockK / SpringMockK
mockk = { module = "io.mockk:mockk", version.ref = "mockk" }
springmockk = { module = "com.ninja-squad:springmockk", version.ref = "springMockk" }

# Mockito Kotlin
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockitoKotlin" }

# ArchUnit
archunit-junit5-engine = { module = "com.tngtech.archunit:archunit-junit5-engine", version.ref = "archunit" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
kotlin-kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
dependency-management = { id = "io.spring.dependency-management", version.ref = "dependencyManagement" }
hibernate-orm = { id = "org.hibernate.orm", version.ref = "hibernate" }
graalvm-native = { id = "org.graalvm.buildtools.native", version.ref = "nativeBuild" }
